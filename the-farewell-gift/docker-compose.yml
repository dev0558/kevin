# =====================================================
# THE FAREWELL GIFT - CTF Challenge
# Exploit3rs Cyber Security Academy
# =====================================================
# Docker Compose Configuration
# =====================================================

version: '3.8'

services:
  farewell-gift:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kevin-farewell-gift
    hostname: nimbus-debug
    ports:
      # Landing page (nginx)
      - "8080:80"
      # Terminal (ttyd) - proxied through nginx
      - "7681:7681"
    restart: unless-stopped
    # Security: Isolated network
    networks:
      - ctf-network
    # Resource limits (prevent abuse)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    # Security options
    security_opt:
      - no-new-privileges:false  # Required for SUID exploit
    # Keep container running
    stdin_open: true
    tty: true
    # Labels for organization
    labels:
      - "ctf.challenge=farewell-gift"
      - "ctf.category=privilege-escalation"
      - "ctf.difficulty=easy"
      - "ctf.author=Exploit3rs Academy"

networks:
  ctf-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# =====================================================
# USAGE:
# =====================================================
#
# Build and start:
#   docker-compose up -d --build
#
# View logs:
#   docker-compose logs -f
#
# Stop:
#   docker-compose down
#
# Reset (rebuild from scratch):
#   docker-compose down -v && docker-compose up -d --build
#
# Access:
#   Landing Page: http://localhost:8080
#   Direct Terminal: http://localhost:7681
#
# =====================================================
